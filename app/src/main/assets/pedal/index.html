<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downshift 웹 페달</title>
<style>
  :root {
    --ground: #0C0D0F; --sheet: #141619; --raised: #1B1E22; --rule: #262A30;
    --ink: #F2F3F5; --muted: #A9AFB8; --faint: #858B95;
    --heat: #FF7A30; --clean: #26C590; --alert: #E5484D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--ink); font-family: system-ui, "Segoe UI", "Malgun Gothic", sans-serif; }
  body { min-height: 100vh; padding: 24px; user-select: none; -webkit-user-select: none; }
  .num { font-variant-numeric: tabular-nums; }
  header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  h1 { font-size: 26px; margin: 0; }
  #conn { font-size: 16px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--rule); color: var(--alert); }
  #conn.on { color: var(--clean); border-color: var(--clean); }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 32px; align-items: start; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
  #pedal { position: relative; width: 260px; height: 420px; border-radius: 28px; background: var(--sheet); border: 2px solid var(--rule);
           overflow: hidden; touch-action: none; cursor: ns-resize; }
  #fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--heat); opacity: .9; }
  #server { position: absolute; left: 0; right: 0; height: 2px; bottom: 0; background: var(--ink); opacity: .7; }
  #pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 700; }
  .hint { color: var(--faint); font-size: 14px; margin-top: 10px; }
  .card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 20px; padding: 20px 24px; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(90px, 1fr)); gap: 12px; }
  .stat b { display: block; font-size: 40px; font-weight: 700; }
  .stat span { color: var(--muted); font-size: 14px; }
  #rpm { color: var(--heat); }
  #engine { color: var(--muted); font-size: 15px; margin-top: 12px; }
  label { display: block; color: var(--muted); font-size: 15px; margin-bottom: 8px; }
  input[type=range] { width: 100%; accent-color: var(--heat); }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: transparent; border: 2px dashed var(--faint); border-radius: 16px; padding: 14px 18px;
           font-size: 17px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  button.go { border-color: var(--clean); color: var(--clean); }
  #find { padding: 6px 12px; font-size: 14px; }
  #rtt { color: var(--faint); font-size: 13px; margin-left: auto; }
  h2 { font-size: 16px; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
</style>
</head>
<body>
<header>
  <h1>Downshift 웹 페달</h1>
  <span id="conn">연결 중…</span>
  <span id="rtt" class="num"></span>
</header>
<main>
  <section>
    <div id="pedal" role="slider" aria-label="가속 페달" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="fill"></div><div id="server"></div><div id="pct" class="num">0%</div>
    </div>
    <div class="hint">페달을 누른 채 아래로 끌수록 깊이 밟아요</div>
  </section>
  <section>
    <div class="card">
      <div class="stats">
        <div class="stat"><b id="rpm" class="num">0</b><span>RPM</span></div>
        <div class="stat"><b id="kph" class="num">0</b><span>km/h</span></div>
        <div class="stat"><b id="gear">-</b><span>기어</span></div>
        <div class="stat"><b id="screen" style="font-size:28px">-</b><span>화면</span></div>
      </div>
      <div id="engine">엔진이 꺼져 있어요. 앱의 시동 화면에서 START를 길게 눌러 주세요</div>
    </div>
    <div class="card">
      <label for="slider">계속 밟고 있기 <span id="sliderValue" class="num">0%</span></label>
      <input id="slider" type="range" min="0" max="100" step="1" value="0">
      <div class="hint">스페이스바: 끝까지 밟기 · ↑/↓: 슬라이더 10%씩 · 0: 슬라이더 0</div>
    </div>
    <div class="card row">
      <span id="pad">게임 패드: 없음 (연결한 뒤 페달을 한 번 밟아 주세요)</span>
      <button id="find" type="button">다시 찾기</button>
    </div>
    <div class="card">
      <h2>진행자</h2>
      <div class="row">
        <button type="button" class="go" data-scene="drive">기어 D</button>
        <button type="button" data-scene="arrive">기어 P · 도착</button>
        <button type="button" data-scene="school">스쿨존 진입</button>
        <button type="button" data-scene="guide">안내 음성</button>
        <button type="button" data-scene="passenger_on">동승자 타기</button>
        <button type="button" data-scene="passenger_off">동승자 내리기</button>
      </div>
    </div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const clamp = (v) => Math.max(0, Math.min(100, v));
const SCREENS = { ONBOARDING: "첫 실행", GARAGE: "개러지", START: "시동", DRIVE: "주행", SUMMARY: "결산" };
// The pedal is the deepest of four sources; it is sent when it changes, at most every 20 ms, the last value always.
const src = { key: 0, pointer: 0, slider: 0, pad: 0 };
let ws = null, sent = -1, sentAt = 0, later = null, pingId = 0;
const pings = new Map();

function value() { return Math.max(src.key, src.pointer, src.slider, src.pad); }
function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

function push() {
  const v = value();
  $("fill").style.height = v + "%";
  $("pct").textContent = v + "%";
  $("pedal").setAttribute("aria-valuenow", v);
  if (v === sent) return;
  const wait = 20 - (performance.now() - sentAt);
  if (wait > 0) {
    if (!later) later = setTimeout(() => { later = null; push(); }, wait);
    return;
  }
  sentAt = performance.now();
  sent = v;
  send({ t: "pedal", p: v });
}

function connect() {
  ws = new WebSocket("ws://" + location.host + "/ws");
  ws.onopen = () => { $("conn").textContent = "연결됨"; $("conn").className = "on"; sent = -1; push(); };
  ws.onclose = () => {
    $("conn").textContent = "연결 끊김 · adb forward tcp:8790 tcp:8790 후 새로고침";
    $("conn").className = "";
    setTimeout(connect, 1000);
  };
  ws.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m.t === "state") show(m);
    if (m.t === "pong" && pings.has(m.id)) {
      $("rtt").textContent = "왕복 " + Math.round(performance.now() - pings.get(m.id)) + "ms";
      pings.delete(m.id);
    }
  };
}

function show(m) {
  $("rpm").textContent = m.rpm;
  $("kph").textContent = m.kph;
  $("gear").textContent = m.gear;
  $("screen").textContent = SCREENS[m.screen] || m.screen;
  $("engine").style.visibility = m.engine ? "hidden" : "visible";
  $("server").style.bottom = "calc(" + m.pct + "% - 1px)";
}

setInterval(() => {
  pingId += 1;
  pings.set(pingId, performance.now());
  if (pings.size > 20) pings.delete(pings.keys().next().value);
  send({ t: "ping", id: pingId });
}, 500);

// Mouse or touch on the pedal: the lower the press, the deeper.
const pedal = $("pedal");
function depth(e) {
  const r = pedal.getBoundingClientRect();
  src.pointer = clamp(Math.round(((e.clientY - r.top) / r.height) * 100));
  push();
}
pedal.addEventListener("pointerdown", (e) => { pedal.setPointerCapture(e.pointerId); depth(e); });
pedal.addEventListener("pointermove", (e) => { if (pedal.hasPointerCapture(e.pointerId)) depth(e); });
for (const t of ["pointerup", "pointercancel"]) pedal.addEventListener(t, () => { src.pointer = 0; push(); });

// Keyboard: the space bar presses all the way; the arrows move the slider.
function setSlider(v) {
  src.slider = clamp(v);
  $("slider").value = src.slider;
  $("sliderValue").textContent = src.slider + "%";
  push();
}
$("slider").addEventListener("input", (e) => setSlider(Number(e.target.value)));
addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); if (!e.repeat) { src.key = 100; push(); } }
  else if (e.code === "ArrowUp") { e.preventDefault(); setSlider(src.slider + 10); }
  else if (e.code === "ArrowDown") { e.preventDefault(); setSlider(src.slider - 10); }
  else if (e.code === "Digit0" || e.code === "Numpad0") setSlider(0);
});
addEventListener("keyup", (e) => { if (e.code === "Space") { e.preventDefault(); src.key = 0; push(); } });
addEventListener("blur", () => { src.key = 0; src.pointer = 0; push(); });

// A game pedal: the axis that moves most from rest the first time it is pressed; the furthest it goes is 100 %.
const pad = { index: -1, axis: -1, rest: 0, full: 1, finding: false, start: [] };
try {
  const saved = JSON.parse(localStorage.getItem("downshift.pad") || "null");
  if (saved) Object.assign(pad, { axis: saved.axis, rest: saved.rest, full: saved.full });
} catch (err) { /* no storage: find the axis again */ }
function save() { try { localStorage.setItem("downshift.pad", JSON.stringify({ axis: pad.axis, rest: pad.rest, full: pad.full })); } catch (err) { /* fine */ } }
function padText(id) {
  $("pad").textContent = pad.index < 0 ? "게임 패드: 없음 (연결한 뒤 페달을 한 번 밟아 주세요)"
    : pad.finding ? "게임 패드: " + id + " · 페달을 밟아 축을 찾는 중…"
    : "게임 패드: " + id + " · 페달 축 a" + pad.axis;
}
function find(gp) { pad.start = gp.axes.slice(); pad.finding = true; padText(gp.id); }
addEventListener("gamepadconnected", (e) => { pad.index = e.gamepad.index; if (pad.axis < 0) find(e.gamepad); else padText(e.gamepad.id); });
addEventListener("gamepaddisconnected", () => { pad.index = -1; src.pad = 0; push(); padText(""); });
$("find").addEventListener("click", (e) => {
  e.currentTarget.blur();
  const gp = pad.index >= 0 ? navigator.getGamepads()[pad.index] : null;
  if (gp) find(gp);
});
function poll() {
  const gp = pad.index >= 0 ? navigator.getGamepads()[pad.index] : null;
  if (gp && pad.finding) {
    let best = -1, moved = 0.3;
    gp.axes.forEach((a, i) => { const d = Math.abs(a - pad.start[i]); if (d > moved) { moved = d; best = i; } });
    if (best >= 0) {
      Object.assign(pad, { axis: best, rest: pad.start[best], full: gp.axes[best], finding: false });
      save();
      padText(gp.id);
    }
  } else if (gp && pad.axis >= 0) {
    const a = gp.axes[pad.axis];
    if (Math.abs(a - pad.rest) > Math.abs(pad.full - pad.rest)) { pad.full = a; save(); }
    const span = pad.full - pad.rest;
    const v = span === 0 ? 0 : clamp(Math.round(((a - pad.rest) / span) * 100));
    if (v !== src.pad) { src.pad = v; push(); }
  }
  requestAnimationFrame(poll);
}
requestAnimationFrame(poll);

// The presenter's scenes; buttons give the focus back so the space bar stays the pedal.
document.querySelectorAll("[data-scene]").forEach((b) => b.addEventListener("click", () => { b.blur(); send({ t: "scene", s: b.dataset.scene }); }));

connect();
push();
</script>
</body>
</html>
